name: 현황판 갱신

on:
  schedule:
    - cron: '7 * * * *'   # 매시 7분(UTC 기준이지만 매시간이라 상관없음). GitHub 사정으로 몇 분 늦을 수 있음
  workflow_dispatch:       # Actions 탭의 'Run workflow' 버튼, 새로고침 버튼(Worker)에서 실행
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 노션·캘린더 데이터 받기
        run: node scripts/refresh.js work
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          CALENDAR_ID: ${{ vars.CALENDAR_ID }}
      - name: 공개용 페이지 만들기
        run: node scripts/build-public.js work dist
        env:
          TRIGGER_URL: ${{ vars.TRIGGER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
