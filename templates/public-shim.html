<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script type="application/json" id="pa-data">__PA_DATA__</script>
<script>
// 대시보드 런타임(dash) 대신 페이지에 넣은 데이터를 돌려주는 최소 구현
(function () {
  const DATA = JSON.parse(document.getElementById('pa-data').textContent);
  const calcs = {}, fns = [];
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const dash = {
    get colors() { return [css('--pa-series-1'), css('--pa-series-2')]; },
    loader() {}, setParams() {}, resetParams() {}, setLink() {}, refresh() {}, params() { return {}; },
    calc(id, def) { calcs[id] = def; },
    data(id) {
      if (Object.prototype.hasOwnProperty.call(DATA, id)) return { status: 'ok', data: DATA[id], columns: [], meta: [] };
      const c = calcs[id];
      if (c) {
        if (!('cache' in c)) { try { c.cache = c.fn(...c.inputs.map((i) => dash.data(i).data)); } catch (e) { c.cache = []; console.error(e); } }
        return { status: 'ok', data: c.cache, columns: [], meta: [] };
      }
      return { status: 'missing', data: [], columns: [], meta: [] };
    },
    onData(fn) { fns.push(fn); fn(); },
  };
  window.dash = dash;
  let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => fns.forEach((f) => f()), 150); });
})();
</script>
<script>
// 새로고침 버튼: 갱신 요청 주소(PA_TRIGGER)가 있으면 GitHub 갱신을 요청하고 반영될 때까지 기다렸다 새로 고친다.
// 없으면 최신 게시본을 다시 불러온다(자동 갱신은 1시간마다).
(function () {
  const btn = document.getElementById('pa-refresh'), msg = document.getElementById('pa-refresh-msg');
  if (!btn) return;
  const TRIGGER = window.PA_TRIGGER || '';
  const snapAt = (txt) => { const m = /"snapshot":\[\{"at":"([^"]+)"/.exec(txt); return m ? m[1] : ''; };
  const current = snapAt(document.getElementById('pa-data').textContent);
  const reload = () => location.replace(location.pathname + '?t=' + Date.now());
  const busy = (on, text) => { btn.disabled = on; btn.classList.toggle('spin', on); msg.textContent = text || ''; };
  btn.addEventListener('click', async () => {
    if (!TRIGGER) { busy(true, '최신 게시본을 불러오는 중…'); reload(); return; }
    busy(true, '갱신을 요청하는 중…');
    let res, body = {};
    try { res = await fetch(TRIGGER, { method: 'POST' }); body = await res.json().catch(() => ({})); }
    catch (e) { busy(false, '갱신 요청을 보내지 못했습니다. 잠시 후 다시 눌러 주세요.'); return; }
    if (body.status === 'cooldown') { busy(true, '방금 갱신이 진행됐거나 진행 중이에요. 최신 게시본을 불러옵니다…'); setTimeout(reload, 1500); return; }
    if (!res.ok) { busy(false, '갱신 요청이 거절됐습니다. 잠시 후 다시 눌러 주세요.'); return; }
    busy(true, '갱신 중이에요. 보통 2~3분 걸리고, 끝나면 자동으로 새로 고칩니다.');
    const started = Date.now();
    const poll = async () => {
      try {
        const r = await fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' });
        const at = snapAt(await r.text());
        if (at && at !== current) { reload(); return; }
      } catch (e) { /* 다음 확인에서 다시 시도 */ }
      if (Date.now() - started > 8 * 60 * 1000) { busy(false, '갱신이 늦어지고 있어요. 몇 분 뒤 다시 새로 고쳐 주세요.'); return; }
      setTimeout(poll, 20000);
    };
    setTimeout(poll, 60000);
  });
})();
</script>
