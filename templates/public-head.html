<title>PA 업무 현황판 (공개용)</title>
<style>
/* 공개용: 대시보드 런타임 없이 그대로 열리도록 토큰과 셸을 직접 정의 */
:root {
  --color-bg: #f7f7f5; --color-panel: #ffffff; --color-fg: #1f1f1d; --color-fg-muted: #6b6a66; --color-border-line: #e4e3df;
  --color-ok: #2f7d4f; --color-warn: #a86a00; --color-bad: #c2412d;
  --cds-chart-grid: #ecebe7; --cds-chart-axis: #c9c8c3; --cds-chart-muted: #c9c8c3; --cds-chart-reference: #8a8984;
  --cds-surface-popover: #ffffff; --cds-border: #e4e3df; --cds-shadow-popover: 0 4px 16px rgba(0,0,0,.12); --cds-text-secondary: #6b6a66;
  --pa-series-1: #3b6fd8; --pa-series-2: #c2412d;
  --font-anthropic-sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-anthropic-serif: "Noto Serif KR", "Batang", Georgia, serif;
  --cds-font-size-caption: 12px; --cds-font-size-body: 14px; --cds-font-size-heading: 16px; --cds-font-size-title: 28px; --cds-font-weight-medium: 600;
  --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 12px; --cds-gap-lg: 20px; --cds-gap-xl: 32px;
  --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 12px; --cds-pad-lg: 18px; --cds-pad-xl: 28px;
  --cds-radius: 10px; --cds-dur-slow: .3s; --cds-ease-out: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --color-bg: #161615; --color-panel: #1f1f1d; --color-fg: #ecebe7; --color-fg-muted: #a3a29d; --color-border-line: #33332f;
  --color-ok: #6cc28c; --color-warn: #e0a83c; --color-bad: #ef7a64;
  --cds-chart-grid: #2b2b28; --cds-chart-axis: #4a4a45; --cds-chart-muted: #4a4a45; --cds-surface-popover: #262624; --cds-border: #3a3a36; --cds-text-secondary: #a3a29d;
  --pa-series-1: #7aa2f0; --pa-series-2: #ef7a64; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --color-bg: #161615; --color-panel: #1f1f1d; --color-fg: #ecebe7; --color-fg-muted: #a3a29d; --color-border-line: #33332f;
  --color-ok: #6cc28c; --color-warn: #e0a83c; --color-bad: #ef7a64;
  --cds-chart-grid: #2b2b28; --cds-chart-axis: #4a4a45; --cds-chart-muted: #4a4a45; --cds-surface-popover: #262624; --cds-border: #3a3a36; --cds-text-secondary: #a3a29d;
  --pa-series-1: #7aa2f0; --pa-series-2: #ef7a64; color-scheme: dark;
}
html, body { margin: 0; }
body { background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: 14px; }
.pa-shell { max-width: 1280px; margin-inline: auto; padding-inline: 16px; }
.pa-public-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding-block: 10px 0; font-size: 12px; color: var(--color-fg-muted); }
.pa-public-bar .grow { flex: 1 1 16rem; min-width: 0; }
.pa-refresh { font: inherit; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--color-border-line); background: var(--color-panel); color: var(--color-fg); cursor: pointer; }
.pa-refresh:hover { border-color: var(--color-fg-muted); }
.pa-refresh:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }
.pa-refresh[disabled] { opacity: .6; cursor: default; }
.pa-refresh svg { width: 14px; height: 14px; }
.pa-refresh.spin svg { animation: pa-spin 1s linear infinite; }
@keyframes pa-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .pa-refresh.spin svg { animation: none; } }
#pa-refresh-msg:empty { display: none; }
.dash-skeleton { color: transparent !important; background: color-mix(in srgb, var(--color-fg) 7%, transparent); border-radius: 6px; }
[hidden] { display: none !important; }
/* 설치 안내: 휴대폰 화면에서만, 앱으로 실행 중이면 숨김 */
.pa-card.pa-install { display: none; }
.pa-install-box { border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-md); background: color-mix(in srgb, var(--color-fg) 3%, var(--color-panel)); font-size: 13px; line-height: 1.6; color: var(--color-fg-muted); display: grid; gap: 6px; }
.pa-install-box p, .pa-install-box ol { margin: 0; }
.pa-install-box ol { padding-left: 1.2em; display: grid; gap: 4px; }
.pa-install-box b { color: var(--color-fg); font-weight: 600; }
.pa-install-os { font-weight: 700; color: var(--color-fg) !important; }
.pa-install-note { font-size: 12px; }
.pa-install-btn { justify-self: start; margin-top: 4px; font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 0; background: var(--color-ok); color: var(--color-bg); cursor: pointer; }
.pa-install-btn:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }
@media (max-width: 640px) { .pa-install:not([hidden]) { display: grid; } }
@media (display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui) { .pa-install { display: none !important; } }
/* 공개용 모바일: 팀 일정 위의 머리말·요약·지표는 숨긴다 */
@media (max-width: 640px) {
  .pa-public-bar, .pa-head, #kpis { display: none !important; }
}</style>
<div class="pa-shell">
<div class="pa-public-bar">
  <span class="grow">로그인 없이 보는 공개용 사본입니다 · 1시간마다 자동 갱신 · 노션 링크는 권한이 있는 사람만 열 수 있습니다</span>
</div>
